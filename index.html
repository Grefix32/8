<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="todo">
        <h1>ToDo List</h1>
        <input id="new-task" type="text" placeholder="Введіть завдання та натисніть Enter">
        <select id="filter" aria-label="Сортування завдань">
            <option value="all">Усі завдання</option>
            <option value="active">Невиконані</option>
            <option value="completed">Виконані</option>
        </select>
        <ul id="task-list"></ul>
    </main>
</body>
</html>
